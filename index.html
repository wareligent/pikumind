<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PikuMind AI Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #1a1a1a; color: #ececec; }
    .sidebar { width: 260px; background: #0f0f0f; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #2d2d2d; }
    .sidebar h2 { font-size: 1.2rem; color: #d97706; margin-bottom: 20px; text-align: center; }
    .new-chat-btn { background: #d97706; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
    .chat-container { flex: 1; display: flex; flex-direction: column; background: #171717; }
    .chat-header { padding: 15px; border-bottom: 1px solid #2d2d2d; font-weight: bold; background: #141414; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
    .user-msg { align-self: flex-end; background: #d97706; color: white; }
    .ai-msg { align-self: flex-start; background: #262626; color: #ececec; border: 1px solid #333; }
    .input-box { padding: 15px; border-top: 1px solid #2d2d2d; background: #141414; display: flex; gap: 10px; }
    .input-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #404040; background: #262626; color: white; outline: none; }
    .input-box button { padding: 12px 20px; border: none; background: #d97706; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>PikuMind</h2>
    <button class="new-chat-btn">+ নতুন চ্যাট</button>
  </div>
  <div class="chat-container">
    <div class="chat-header">PikuMind AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
      <div class="message ai-msg">আসসালামু আলাইকুম! আমি PikuMind। আজকে তোমাকে কীভাবে সাহায্য করব বলো?</div>
    </div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="এখানে কিছু লেখੋ..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">পাঠাও</button>
    </div>
  </div>
  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      const box = document.getElementById('chatMessages');
      box.innerHTML += `<div class="message user-msg">${text}</div>`;
      input.value = '';
      setTimeout(() => {
        box.innerHTML += `<div class="message ai-msg">তোমার কথা পেয়েছি: "${text}"। এটা নিয়ে কাজ করছি!</div>`;
        box.scrollTop = box.scrollHeight;
      }, 500);
    }
  </script>
</body>
</html>
